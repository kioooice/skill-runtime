[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-runtime"
version = "0.2.0rc1"
description = "Local governed skill runtime for host AI systems."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "kioooice" },
]
keywords = ["ai", "codex", "skills", "runtime", "agents", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "mcp>=1.16.0,<2",
]

[project.urls]
Homepage = "https://github.com/kioooice/skill-runtime"
Repository = "https://github.com/kioooice/skill-runtime"
Issues = "https://github.com/kioooice/skill-runtime/issues"
Documentation = "https://github.com/kioooice/skill-runtime#readme"

[project.scripts]
skill-runtime = "skill_runtime.cli:main"
skill-runtime-mcp = "skill_runtime.mcp_stdio:main"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["skill_runtime*"]
