[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-runtime"
version = "0.1.0"
description = "Local governed skill runtime for host AI systems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.16.0,<2",
]

[project.scripts]
skill-runtime = "skill_runtime.cli:main"
skill-runtime-mcp = "skill_runtime.mcp_stdio:main"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["skill_runtime*"]
